# Release pipeline — the "build off main" half of the model (validation happens
# off develop: see validate.yml). main only ever advances via a human-approved
# develop -> main PR (opened with `make release`, then approved + merged by YOU on
# GitHub), so the commit this builds passed the full develop gate AND a human
# review. Merging that PR is a push to main, which triggers this workflow to build
# the multi-arch add-on image FROM main, push it to GHCR, then tag v<version> and
# cut the GitHub release — all in CI, no local step.
#
# Triggered by a push to main (the release-PR merge), or manually: Actions ->
# release -> Run workflow on `main` (equivalently `make release-build`).
# Idempotent: if v<version> is already tagged it no-ops, so a re-run — or a push
# to main that didn't bump the version — can't double-publish.
#
# Version source of truth: addon/config.yaml `version:` — Supervisor pulls
# image:<version>, so the config version and the GHCR tag move in lockstep.
#
# Why a human merge, not a bot: we deliberately don't let the Actions bot create
# or approve the release PR — your merge IS the release gate (that was the whole
# point). A human can also land .github/workflows/ changes on main, which the
# GITHUB_TOKEN refuses to push. The build itself needs only contents:write (tag +
# release) and packages:write (GHCR push). `timeout-minutes` caps the QEMU arm64
# build so a hang fails fast.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Releases are built from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main (got ${{ github.ref }}). Releases build off main — merge the develop->main PR ('make release' opens it) or dispatch this on main ('make release-build')."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read version; skip if already released
        id: ver
        run: |
          v=$(sed -n 's/^version: "\(.*\)"/\1/p' addon/config.yaml)
          test -n "$v" || { echo "::error::no version in addon/config.yaml"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::notice title=Already released::v$v is already tagged — nothing to build."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        if: steps.ver.outputs.release == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.ver.outputs.release == 'true'
      - uses: docker/login-action@v4
        if: steps.ver.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push multi-arch image
        if: steps.ver.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nick-tgcs/legit-lp-for-ha:${{ steps.ver.outputs.version }}
            ghcr.io/nick-tgcs/legit-lp-for-ha:latest
          labels: |
            io.hass.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.source=https://github.com/nick-tgcs/legit-lp-for-ha
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag + GitHub release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v='${{ steps.ver.outputs.version }}'
          git tag "v$v"
          git push origin "v$v"
          gh release create "v$v" --target "$GITHUB_SHA" --title "v$v" --generate-notes
          echo "::notice title=Released::v$v built off main, image on GHCR, tag + release published."
