# Release pipeline: build + publish the add-on image FROM develop. CI does the
# part that needs a runner — the full test gate and the multi-arch GHCR push —
# then STOPS. The develop->main promote + tag + GitHub release are a local
# `make promote` step, NOT done here: advancing main across .github/workflows/
# changes needs a credential the Actions GITHUB_TOKEN lacks (it refuses to push
# workflow files), whereas a developer's SSH key may. The full flow:
#   1. bump addon/config.yaml `version:` on develop
#   2. `make release`  -> this workflow: test gate + multi-arch image to GHCR
#   3. `make promote`  -> FF main onto develop's tip, tag v<version>, release
# (the store reads main's tip, so the image MUST be pullable before main moves —
# hence the image is published here, in CI, and main is advanced afterwards).
# Version source of truth: addon/config.yaml `version:` (Supervisor pulls
# image:<version>, so config version and image tag must be in lockstep).
# Re-releasing an existing tag is refused (bump first). `timeout-minutes` caps
# the QEMU arm64 build so a hang fails fast instead of wedging the run.
name: release
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Releases are cut from develop only
        if: github.ref != 'refs/heads/develop'
        run: |
          echo "::error::Run this workflow on the develop branch (got ${{ github.ref }})"
          exit 1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scheduler
      - run: make test

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version, refuse re-release
        id: ver
        run: |
          v=$(sed -n 's/^version: "\(.*\)"/\1/p' addon/config.yaml)
          test -n "$v" || { echo "::error::no version in addon/config.yaml"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::v$v already released — bump addon/config.yaml version on develop first"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nick-tgcs/legit-lp-for-ha:${{ steps.ver.outputs.version }}
            ghcr.io/nick-tgcs/legit-lp-for-ha:latest
          labels: |
            io.hass.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.source=https://github.com/nick-tgcs/legit-lp-for-ha
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image published — finish locally with `make promote`
        run: |
          v='${{ steps.ver.outputs.version }}'
          echo "::notice title=Image published::ghcr.io/nick-tgcs/legit-lp-for-ha:$v is on GHCR. Finish the release locally: 'make promote' (fast-forwards main onto develop, tags v$v, creates the GitHub release — over SSH, which may advance main across workflow-file changes)."
