# PR validation + develop CI. The `test` job name is the required status check on
# both rulesets — every develop push gets it. The `promote` workflow opens the
# develop -> main release PR with develop's tip as its head, so that SHA already
# carries this `test` check and a release only ever advances main to a checked SHA
# — no pull_request rerun on the promote PR is needed (which also means a
# bot-authored develop tip can't put the release PR's required check in
# `action_required`). `timeout-minutes` on every job so a hung step fails fast
# instead of burning a runner (and a day) the way an untimed build can.
name: validate
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scheduler
      - run: make test

  # Proves the repo-root Dockerfile still builds (HiGHS compiles in-container).
  # amd64 only here; the release builds the full multi-arch set.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # HA add-on config lint (schema, options/schema agreement, manifest sanity).
  addon-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./addon

  # Security gate: fail the PR if any dependency carries a known RUSTSEC
  # advisory. Complements GitHub's (continuous) Dependabot security updates
  # with an in-PR check, so a vulnerable bump can't merge. Runs on every PR
  # and develop push, so it is safe to require on the develop ruleset.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cd scheduler && cargo audit

  # Coverage gate: measure line coverage with cargo-tarpaulin (via `make
  # coverage`, the same command run locally) and fail the PR if it falls below
  # the floor baked into the Makefile. The HTML report is uploaded as a build
  # artifact so a reviewer can see exactly which lines a PR leaves uncovered.
  # Safe to require on the develop ruleset: runs on every PR and develop push.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scheduler
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - run: make coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: scheduler/target/tarpaulin/tarpaulin-report.html
          if-no-files-found: warn
