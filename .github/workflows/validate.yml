# PR validation + develop CI. The `test` job name is the required status
# check on main's ruleset — every develop push gets it, so a release
# (fast-forwarding develop onto main) always promotes a checked SHA.
name: validate
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scheduler
      - run: make test

  # Proves the repo-root Dockerfile still builds (HiGHS compiles in-container).
  # amd64 only here; the release builds the full multi-arch set.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # HA add-on config lint (schema, options/schema agreement, manifest sanity).
  addon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./addon
