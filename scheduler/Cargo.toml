[package]
name = "legit-lp-scheduler"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "legit-lp-scheduler"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9" # archived upstream but stable/ubiquitous; swap for a maintained fork only if it bites
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1" # main.rs / config boundary only
good_lp = { version = "1", features = ["highs"], default-features = false }
axum = "0.8"
rust-embed = "8"
async-stream = "0.3.6"
futures-core = "0.3.32"

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
insta = "1"
proptest = "1"
tempfile = "3"
jsonschema = { version = "0.49.1", default-features = false }
tower = "0.5.3"
regex = "1.12.4"
reqwest = "0.12"
